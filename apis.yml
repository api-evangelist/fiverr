name: Fiverr
description: 'Fiverr is a global online marketplace for freelance digital services,
  founded in 2010 and headquartered in Tel Aviv, Israel, and publicly traded on the
  New York Stock Exchange (NYSE: FVRR). The platform connects businesses and individuals
  with freelancers offering "gigs" across hundreds of categories including graphic
  design, writing and translation, programming and tech, video and animation, digital
  marketing, music and audio, and AI services. Fiverr also operates Fiverr Pro and
  Fiverr Enterprise for vetted talent and managed teams, Fiverr Workspace for freelancer
  business tooling, and an affiliate partnership program. Fiverr does not currently
  publish a public developer API portal or OpenAPI-described API; its programmatic
  surfaces are limited to the consumer marketplace and partner/affiliate integrations.
  This profile was surfaced as a portfolio company of Accel and Bessemer Venture Partners
  and enriched with the public identity, security, and discovery signals available.'
